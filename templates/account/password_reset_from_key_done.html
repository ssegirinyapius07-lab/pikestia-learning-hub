{% extends "base.html" %}

{% block title %}Password updated | Pikestia Learning Hub{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="container auth-container">
    <div class="auth-card card">
      <div class="auth-status-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M5 12.5 9.2 17 19 7"></path>
        </svg>
      </div>
      <div class="auth-header">
        <h1>Password updated</h1>
        <p>Your password has been changed successfully. You can now sign in with your new password.</p>
      </div>
      <a href="{% url 'account_login' %}" class="btn btn-primary auth-submit">Sign in</a>
    </div>
  </div>
</section>
{% endblock %}

{% extends "base.html" %}{% block content %}<div class="container section"><h1>Learning Resources</h1><div class="grid grid-3">{% for r in resources %}<a class="card card-hover" href="/learn/{{ r.topic.subject.slug }}/{{ r.topic.slug }}/{{ r.slug }}/"><div class="card-meta">{{ r.topic.subject.title }} • {{ r.topic.title }}</div><h3>{{ r.title }}</h3><p>{{ r.summary|truncatechars:110 }}</p></a>{% endfor %}</div></div>{% endblock %}

{% extends "base.html" %}{% block content %}<div class="container section"><h1>Subjects</h1><div class="grid grid-3">{% for s in subjects %}<a class="card card-hover" href="/subjects/{{ s.slug }}/"><h3>{{ s.title }}</h3><p>{{ s.description|truncatechars:120 }}</p><span class="badge">{{ s.discipline }}</span></a>{% endfor %}</div></div>{% endblock %}
